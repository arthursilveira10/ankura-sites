<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..500&family=Newsreader:opsz,wght@6..72,350..400&display=swap" rel="stylesheet">
<style>

<div class="og"><div class="brilho"></div><img class="medico" src="img/medico-verde.webp" alt="">
