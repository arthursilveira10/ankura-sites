secoes:
  - tipo: topo
    titulo: Melasma tem controle. E começa por entender a sua pele.
    subtitulo: Eu monto um plano que cabe na sua rotina, com o que fazer em casa e procedimentos quando forem indicados.
    foto:
      src: ../../assets/medico-recorte.webp
      alt: Dr. Arthur Silveira, de braços cruzados, sorrindo
    fundo:
      src: ../../assets/fundo-topo.webp
      alt: ''
    botao:
      texto: Agendar avaliação
    apoio: A avaliação vem antes de qualquer procedimento

  - tipo: identificacao
    variante: lista
    titulo: Se você já passou por isso...
    itens:
      - titulo: A mancha que volta todo verão
        icone: sol
        texto: Você trata, clareia, e com o primeiro sol forte ela aparece de novo.
      - titulo: O corretivo como obrigação
        icone: rosto
        texto: Sair sem base virou exceção, e isso cansa.
      - titulo: O ácido que irritou a pele
        icone: frasco
        texto: Você tentou sozinha e a pele ficou vermelha, sensível ou até mais manchada.
    cta:
      texto: Quero entender o meu caso
      posicao: meio-1

  - tipo: o-que-e
    faixa: true
    seta: true
    titulo: Uma condição crônica, que pede acompanhamento.
    texto: |-
      O melasma é uma mancha escura que aparece principalmente no rosto. Sol, hormônios e calor estão entre os gatilhos mais comuns.

      Ele não tem cura definitiva, mas tem controle. O que funciona é um plano contínuo, ajustado ao longo do ano, e não um tratamento isolado.
    foto:
      src: ../../assets/procedimento-melasma.webp
      alt: ''

  - tipo: como-funciona
    faixa: true
    variante: passos-simples
    titulo: Três frentes que trabalham juntas.
    passos:
      - titulo: Proteção
        icone: sol
        texto: Protetor certo para a sua pele e para a sua rotina, inclusive dentro de casa.
      - titulo: Cuidados em casa
        icone: frasco
        texto: Uma rotina simples, com ativos escolhidos para o seu tipo de pele e o seu momento.
      - titulo: Procedimentos
        icone: lupa
        texto: Quando indicados, para potencializar o plano. Sempre com cuidado para não irritar a pele.

  - tipo: como-funciona
    variante: passos-com-linha
    titulo: Como é a avaliação do melasma.
    texto: Sem pressa e sem promessa. É assim que a gente começa.
    passos:
      - quando: Antes
        titulo: Você chama no WhatsApp
        texto: A minha equipe agenda a avaliação e te pede para vir sem maquiagem, se puder. [FICTÍCIO]
      - quando: Na consulta
        titulo: Eu entendo a sua história
        texto: Quando a mancha começou, o que piora, o que você já usou e como é a sua rotina com o sol.
      - quando: No exame
        titulo: Eu examino a sua pele
        texto: Com luz adequada e, quando precisa, com dermatoscópio, para ver a profundidade da mancha.
      - quando: No fim
        titulo: Você sai com um plano
        texto: Por escrito, com proteção, cuidados em casa e, se fizer sentido, procedimentos.
      - quando: Depois
        titulo: Eu acompanho as estações
        texto: Nos retornos eu ajusto o plano conforme o sol, o calor e a resposta da sua pele.
    cta:
      texto: Quero agendar minha avaliação
      posicao: meio-2

  - tipo: antes-depois
    titulo: Acompanhamento ao longo dos meses.
    casos:
