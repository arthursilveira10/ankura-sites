        depois: { alt: Depois do acompanhamento, reservado: 'DEPOIS [foto real com autorização]' }
        legenda: Após 4 meses de acompanhamento. Caso ilustrativo [FICTÍCIO].
      - antes: { alt: Antes do tratamento, reservado: 'ANTES [foto real com autorização]' }
        depois: { alt: Depois do acompanhamento, reservado: 'DEPOIS [foto real com autorização]' }
        legenda: Após 6 meses de acompanhamento. Caso ilustrativo [FICTÍCIO].
      - antes: { alt: Antes do tratamento, reservado: 'ANTES [foto real com autorização]' }
        depois: { alt: Depois do acompanhamento, reservado: 'DEPOIS [foto real com autorização]' }
        legenda: Após 9 meses de acompanhamento. Caso ilustrativo [FICTÍCIO].
    avisoLegal: Imagens publicadas com autorização do paciente. Os resultados variam de pessoa para pessoa e não representam promessa ou garantia de resultado. Responsável técnico Dr. Arthur Silveira, CRM 000000-SP, RQE 00000 [FICTÍCIO].

  - tipo: profissional
    titulo: Prazer, eu sou o Arthur.
    texto: |-
      Escolhi a dermatologia porque a pele mexe com a forma como a gente se vê. Na residência, percebi que muita gente chegava ao consultório depois de anos tentando resolver sozinha, com produtos indicados por amigos ou pela internet.

      Por isso a minha consulta começa pela conversa. Pergunto da sua rotina e do que você já usou. Examino com calma e, quando precisa, te mostro no dermatoscópio o que estou vendo.

      Você sai sabendo o porquê de cada passo, com o plano por escrito. Muitas vezes o começo é mais simples do que você imagina. [FICTÍCIO]
    foto:
      src: ../../assets/sobre-composicao.webp
      alt: Dr. Arthur Silveira sorrindo, de camisa verde, em frente a um fundo de luz quente
    composicao: true
    fatos:
      - valor: 12 anos
        rotulo: de formado [FICTÍCIO]
        icone: chapeu
      - valor: RQE
        rotulo: título de especialista em dermatologia
        icone: selo
      - valor: Desde 2019
        rotulo: atendendo em Campinas [FICTÍCIO]
        icone: local

  - tipo: faq
    faixa: true
    titulo: O que as pacientes mais perguntam.
    perguntas:
      - pergunta: Melasma tem cura?
        resposta: Não existe cura definitiva, mas existe controle. Com acompanhamento, a maioria das pessoas consegue manter as manchas bem mais leves.
      - pergunta: Posso começar o tratamento em qualquer época do ano?
        resposta: Pode. Na consulta eu ajusto o plano para a estação em que você está.
      - pergunta: Quanto tempo leva para ver diferença?
        resposta: Costuma levar algumas semanas para as primeiras mudanças. O plano é pensado para meses, com retornos.
      - pergunta: Laser resolve?
        resposta: Em alguns casos ajuda, em outros piora. Por isso eu só indico depois de avaliar a sua pele.

  - tipo: cta-final
    faixa: true
    titulo: Vamos montar o seu plano?
    texto: Me chama no WhatsApp. Na avaliação eu entendo a sua pele e te explico cada passo.
    botao:
      texto: Agendar avaliação
    apoio: Respondemos em horário comercial.
