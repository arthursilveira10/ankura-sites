# HOME (demo [FICTÍCIO]). Cada item de "secoes" é uma seção, na ordem em que aparece.
# Tipos e variantes: .claude/skills/site-build/references/template.md
# Seções com "faixa: true" seguidas dividem a mesma faixa de fundo (entra com o horizonte do conceito).
tipo: home
nome: Início
seo:
  titulo: Dr. Arthur Silveira, dermatologista em Campinas
  descricao: Dermatologia clínica e estética em Campinas. Consulta com tempo para entender sua pele e um plano que cabe na sua rotina.
  imagem: ../../assets/compartilhamento.png
cta:
  botaoMenu: Agendar consulta
  barra: Agendar consulta
  mensagem: Olá! Vim pelo site e quero agendar uma consulta com o Dr. Arthur.

secoes:
  - tipo: topo
    titulo: Sua pele tem uma história. Eu começo por ela.
    subtitulo: Sou o Arthur, dermatologista em Campinas. Na primeira consulta, a gente conversa com calma antes de qualquer tratamento.
    foto:
      src: ../../assets/medico-recorte.webp
      alt: Dr. Arthur Silveira, de braços cruzados, sorrindo
    fundo:
      src: ../../assets/fundo-topo.webp
      alt: ''
    botao:
      texto: Agendar consulta
    apoio: Consulta de 50 minutos, com retorno incluído

  - tipo: identificacao
    titulo: Você já tentou de tudo e a pele continua do mesmo jeito?
    texto: Se você se reconhece em alguma dessas situações, a primeira consulta foi pensada para você.
    itens:
      - titulo: O armário cheio de produtos
        icone: frasco
        texto: Você compra o que viu no vídeo, usa por duas semanas e não sabe se funcionou.
      - titulo: A mancha que volta todo verão
        icone: sol
        texto: Melhora no inverno, volta com o sol, e você já nem sabe mais o que passar.
      - titulo: As linhas que deixam o rosto com ar cansado
        icone: rosto
        texto: Você se sente bem, mas o espelho conta outra história.
      - titulo: A consulta de cinco minutos
        icone: relogio
        texto: Você saiu com uma receita e nenhuma explicação sobre a sua pele.

  - tipo: profissional
    faixa: true
    titulo: Prazer, eu sou o Arthur.
    texto: |-
      Escolhi a dermatologia porque a pele mexe com a forma como a gente se vê. Na residência, percebi que muita gente chegava ao consultório depois de anos tentando resolver sozinha, com produtos indicados por amigos ou pela internet.

      Por isso a minha consulta começa pela conversa. Pergunto da sua rotina e do que você já usou. Examino com calma e, quando precisa, te mostro no dermatoscópio o que estou vendo.

      Você sai sabendo o porquê de cada passo, com o plano por escrito. Muitas vezes o começo é mais simples do que você imagina. [FICTÍCIO]
    foto:
      src: ../../assets/sobre-composicao.webp
      alt: Dr. Arthur Silveira sorrindo, de camisa verde, em frente a um fundo de luz quente
    composicao: true
    fatos:
      - valor: 12 anos
        rotulo: de formado [FICTÍCIO]
        icone: chapeu
      - valor: RQE
        rotulo: título de especialista em dermatologia
        icone: selo
      - valor: Desde 2019
        rotulo: atendendo em Campinas [FICTÍCIO]
        icone: local

  - tipo: como-funciona
    variante: passos-com-linha
    titulo: Do primeiro contato ao plano na sua mão.
    texto: Sem pressa e sem surpresa. É assim que a consulta acontece.
    passos:
      - quando: Antes
        titulo: Você chama no WhatsApp
        texto: A minha equipe te ajuda a encontrar um horário e manda as orientações para o dia.
      - quando: Primeiros minutos
        titulo: A gente conversa
        texto: A consulta dura cerca de 50 minutos. Começo ouvindo sua história e sua rotina de cuidados.
      - quando: No exame
        titulo: Eu examino a sua pele
        texto: Com calma e com dermatoscópio quando precisa. Vou te mostrando e explicando o que encontro.
      - quando: No fim da consulta
        titulo: Você sai com um plano
        texto: Por escrito, com o que fazer em casa e, se fizer sentido, quais procedimentos considerar.
      - quando: Depois
        titulo: Eu acompanho de perto
        texto: O retorno está incluído para ajustarmos o plano conforme a sua pele responde.
    cta:
      texto: Quero agendar minha consulta
      posicao: meio-1

  - tipo: procedimentos
    variante: lista-com-imagem
    titulo: Por onde você quer começar?
    texto: Cada tratamento tem uma página explicando como funciona, para quem é indicado e o que esperar.

  - tipo: depoimentos
    faixa: true
    titulo: O que os pacientes contam.
    nota:
      valor: '5,0'
      total: 120 avaliações [FICTÍCIO]
    itens:
      - texto: Foi a primeira vez que um médico me explicou o que eu tenho na pele. Saí da consulta entendendo a minha rotina.
        autor: M. A. [FICTÍCIO]
        origem: Google
      - texto: Consulta sem pressa. Ele respondeu todas as minhas dúvidas e me passou tudo por escrito.
        autor: R. S. [FICTÍCIO]
        origem: Google
      - texto: Gostei de ele não ter empurrado procedimento. Começamos pelo básico e fomos ajustando.
        autor: L. P. [FICTÍCIO]
        origem: Google
    cta:
      texto: Quero conversar com o Dr. Arthur
      posicao: meio-2

  - tipo: faq
    faixa: true
    titulo: Antes de agendar.
    perguntas:
      - pergunta: Você atende convênio?
        resposta: O atendimento é particular. Se o seu plano tiver reembolso, eu emito o recibo para você solicitar.
      - pergunta: Quanto tempo dura a consulta?
        resposta: Cerca de 50 minutos. É tempo para ouvir sua história, examinar com calma e explicar o plano.
      - pergunta: O retorno está incluído?
        resposta: Sim. Um retorno em até 30 dias, para ajustarmos o plano conforme a sua pele responde.
      - pergunta: Preciso levar alguma coisa?
        resposta: Se puder, traga os produtos que você usa hoje ou fotos dos rótulos, e exames recentes se tiver.
      - pergunta: Faço o procedimento no mesmo dia da consulta?
        resposta: Às vezes sim, quando é indicado e você está à vontade com a decisão. Mas eu prefiro que ela seja tranquila, nunca no impulso.

  - tipo: cta-final
    faixa: true
    titulo: Sua pele merece uma consulta sem pressa.
    texto: Me chama no WhatsApp. A minha equipe responde em horário comercial e te ajuda a escolher o melhor dia.
    botao:
      texto: Agendar pelo WhatsApp
    apoio: Segunda a sexta, das 8h às 18h. [FICTÍCIO]
